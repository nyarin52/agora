version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    environment:
      - AGORA_PORT=8080
      - AGORA_DB_DIR=/data/agora-db
      - AGORA_AUTH_TOKEN=${AGORA_AUTH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./agora-db:/data/agora-db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agora_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - agora_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${AGORA_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agora_net

networks:
  agora_net:
    driver: bridge
